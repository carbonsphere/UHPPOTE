# Builds UHPPOTE-Manager.exe for Windows and UHPPOTE-Manager.apk for Android.
#
# Push a tag such as v1.0.0 to publish a GitHub Release with the .exe and .apk files:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Or run it by hand from the Actions tab ("Run workflow") to get the files as
# downloadable build artifacts without making a release.
#
# The APK is signed with the key in these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the Android app is still built and tested, but no APK is released.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build jobs get a read-only token; only publish can create the release.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Windows/go.mod
          cache-dependency-path: Windows/go.sum

      - name: Test
        run: go test ./uhppote

      - name: Build
        run: |
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o UHPPOTE-Manager.exe ./gui
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-H windowsgui -s -w" -o UHPPOTE-Manager-arm64.exe ./gui

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Windows/UHPPOTE-Manager.exe
            Windows/UHPPOTE-Manager-arm64.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is not signed and will not be released."
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION_ARG=""
          if [ "$REF_TYPE" = "tag" ]; then VERSION_ARG="-PappVersion=${REF_NAME#v}"; fi
          ./gradlew test assembleRelease $VERSION_ARG

      - name: Collect APK
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/UHPPOTE-Manager.apk
          else
            echo "::warning::No signed APK was built; the release will not include the Android app."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Android/out/
          if-no-files-found: warn

  publish:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$REPO" --title "UHPPOTE Manager $TAG" --generate-notes
